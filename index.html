<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldrin & Charm Wedding Invitation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: #b76e79;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .media-container {
            margin: 20px 0;
        }
        video, audio {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .rsvp-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        button {
            background-color: #b76e79;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #9d5b64;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aldrin & Charm</h1>
        <p>You are cordially invited to celebrate our wedding day!</p>
        
        <div class="media-container">
            <h3>Our Love Story</h3>
            <video controls src="story.mp4"></video>
        </div>

        <div class="media-container">
            <h3>Background Music</h3>
            <audio controls src="music.mp3"></audio>
        </div>

        <div class="rsvp-section">
            <h3>RSVP Confirmation</h3>
            <p>Please let us know if you can make it.</p>
            <button onclick="sendRSVP('Attending')">Confirm Attendance</button>
        </div>
    </div>

    <script>
        // Backend API Base URL
        const API_URL = 'https://wedding-invitation-vh7t.onrender.com';

        // Kunin ang token mula sa URL parameters (halimbawa: ?token=xyz)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Optional: I-verify ang guest token pagbukas ng page
        async function verifyGuest() {
            if (!token) {
                console.warn('No guest token provided.');
                return;
            }
            try {
                const response = await fetch(`${API_URL}/api/verify?token=${token}`);
                const data = await response.json();
                if (!response.ok) {
                    alert('Invalid or expired link!');
                    // Pwede mong i-redirect sa prank page kung gusto mo
                    // window.location.href = 'prank.html';
                }
            } catch (err) {
                console.error('Error verifying guest:', err);
            }
        }

        // Function para sa RSVP submission
        async function sendRSVP(status) {
            if (!token) {
                alert('Missing invitation token.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/rsvp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, status })
                });

                const result = await response.json();
                if (response.ok) {
                    alert('Thank you! Your RSVP has been recorded.');
                } else {
                    alert(result.message || 'Something went wrong.');
                }
            } catch (err) {
                console.error('RSVP Error:', err);
                alert('Failed to connect to the server.');
            }
        }

        // Tawagin ang verification pagka-load ng page
        verifyGuest();
    </script>
</body>
</html>
